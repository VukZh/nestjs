name: CI/CD Pipeline
on:
  push:
    branches:
      - CICD

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint -w packages/frontend
      - name: Lint backend
        run: npm run lint -w packages/backend
      - name: Test backend
        continue-on-error: true
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/test_db?schema=public
          JWT_SECRET: secret
        run: |
          cd packages/backend
          npx prisma generate
          npx prisma migrate deploy
          npm run test:e2e
      - name: Build backend check
        run: |
          cd packages/backend
          npm run build
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image names
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/nestjs-backend:latest
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/nestjs-frontend:latest
